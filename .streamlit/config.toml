# Identité de l'interface : vermillon « carton rouge », titres condensés façon tableau d'affichage
[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Barlow Condensed:https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "small"
showWidgetBorder = true

[theme.light]
primaryColor = "#D7361E"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#ECE8DF"
textColor = "#16150F"

[theme.dark]
primaryColor = "#F0573C"
backgroundColor = "#11130F"
secondaryBackgroundColor = "#1C1F1A"
textColor = "#EEECE5"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
