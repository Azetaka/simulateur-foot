[project]
name = "simulateur-foot"
version = "0.1.0"
description = "Simulateur de Ligue 1 : notes Elo des clubs, prédiction des matchs et simulation de fin de saison"
readme = "README.md"
authors = [
    { name = "Azetaka", email = "uriel.fagninou67347345@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[project.scripts]
simulateur-foot = "simulateur_foot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
