# Met à jour data/resultats.csv, data/prochains_matchs.csv, data/joueurs.csv et
# data/pronostics.csv deux fois par semaine
# et les commite sur develop.
# football-data.co.uk publie en général le lundi (week-end) et en milieu de
# semaine (matchs du mardi-mercredi) : on passe le mardi et le vendredi matin.
#
# GitHub ne lance les tâches planifiées que depuis la branche par défaut :
# ce fichier doit être présent sur main pour que le planning s'active.
# Lancement à la main : onglet Actions → « Mise à jour des données » → Run workflow.

name: Mise à jour des données

on:
  schedule:
    - cron: "0 6 * * 2,5"  # mardi et vendredi, 6 h UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-a-jour-donnees
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: astral-sh/setup-uv@v5

      - name: Installer le projet
        run: uv sync --locked

      - name: Télécharger la saison en cours et la prochaine journée
        run: uv run simulateur-foot maj

      - name: Enregistrer les pronostics des matchs à venir
        run: uv run simulateur-foot pronostics

      - name: Télécharger les buteurs et les passeurs
        # ESPN peut être indisponible : on garde alors le fichier précédent
        run: uv run simulateur-foot joueurs || echo "Statistiques des joueurs non mises à jour."

      - name: Vérifier que tout fonctionne avec les nouvelles données
        run: uv run pytest -q

      - name: Commiter les nouveaux résultats
        run: |
          git add data/resultats.csv data/prochains_matchs.csv data/joueurs.csv
          if [ -f data/pronostics.csv ]; then git add data/pronostics.csv; fi
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Données : résultats au $(date -u +%d/%m/%Y)"
          git push
